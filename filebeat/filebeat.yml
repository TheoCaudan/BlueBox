filebeat.inputs:
- type: log
  enabled: true
  paths:
    - /var/log/readonly/*.log
    - /var/log/suricata/eve.json
  encoding: utf-8
  json:
    keys_under_root: true
    overwrite_keys: true
    add_error_key: true

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
logging.to_files: true
logging.files:
  path: /var/share/filebeat
  name: filebeat.log
  keepfiles: 7
  permissions: 0644
